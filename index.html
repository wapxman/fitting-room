<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Примерочная</title>
<style>
  :root{
    --bg:#0f1115; --panel:#15181f; --panel2:#1b1f28; --line:#262b36;
    --ink:#eef1f6; --dim:#98a1b1; --accent:#6ea8fe; --accent2:#2b3a55;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:grid; grid-template-columns:1fr 340px; height:100%}

  /* ---------- сцена ---------- */
  #stage{position:relative; min-width:0; overflow:hidden; background:#7a7a7c}
  /* Два слоя друг над другом: между соседними ракурсами делаем перекрёстное
     затухание, иначе поворот ощущается щелчками. */
  .layer{position:absolute; inset:0; background-repeat:no-repeat;
         background-position:center bottom; background-size:contain; will-change:opacity}
  #stage.grabbing{cursor:grabbing} #stage{cursor:grab}

  #top{position:absolute; left:14px; top:14px; right:14px; display:flex; gap:8px;
       flex-wrap:wrap; pointer-events:none; z-index:3}
  .chip{pointer-events:auto; background:rgba(16,18,23,.72); border:1px solid rgba(255,255,255,.14);
        color:#fff; padding:8px 13px; border-radius:999px; font-size:13px; cursor:pointer;
        backdrop-filter:blur(10px); user-select:none; white-space:nowrap}
  .chip:hover{background:rgba(16,18,23,.9)}
  .chip.on{background:var(--accent); color:#0b1220; border-color:transparent; font-weight:600}
  .grow{flex:1}

  #dial{position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
        display:flex; align-items:center; gap:12px; z-index:3;
        background:rgba(16,18,23,.72); border:1px solid rgba(255,255,255,.14);
        padding:9px 16px; border-radius:999px; backdrop-filter:blur(10px)}
  #dial input{width:180px; accent-color:var(--accent)}
  #deg{font-variant-numeric:tabular-nums; font-size:12.5px; color:#dfe5ee; min-width:42px; text-align:right}
  #msg{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
       z-index:4; background:rgba(16,18,23,.55); backdrop-filter:blur(3px); padding:24px}
  #msg.on{display:flex}
  #msg .box{max-width:340px; text-align:center; background:rgba(16,18,23,.92);
            border:1px solid var(--line); border-radius:16px; padding:18px 20px}
  #msg b{display:block; margin-bottom:6px; font-size:15px}
  #msg span{color:var(--dim); font-size:13px}

  /* ---------- панель ---------- */
  #side{background:var(--panel); border-left:1px solid var(--line); display:flex;
        flex-direction:column; min-height:0}
  #side header{padding:14px 16px 10px; border-bottom:1px solid var(--line)}
  #side h1{margin:0 0 3px; font-size:16px}
  #side .sub{color:var(--dim); font-size:12px}
  #picks{overflow-y:auto; padding:14px; flex:1; min-height:0}
  .row{margin-bottom:18px}
  .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 2px 9px}
  .opts{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
  .opt{background:var(--panel2); border:1px solid transparent; border-radius:12px;
       padding:7px; cursor:pointer; text-align:center}
  .opt:hover{border-color:#333b4a}
  .opt.on{border-color:var(--accent); background:var(--accent2)}
  .opt .th{width:100%; aspect-ratio:3/4; border-radius:8px; background:#6f6f71 center/cover no-repeat;
           margin-bottom:6px; border:1px solid rgba(255,255,255,.1)}
  .opt .nm{font-size:11.5px; line-height:1.25}
  #side footer{padding:10px 14px; border-top:1px solid var(--line); color:var(--dim); font-size:11.5px}
  #bar{height:4px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-top:7px}
  #bar i{display:block; height:100%; background:var(--accent)}

  @media (max-width:880px){
    #app{grid-template-columns:1fr; grid-template-rows:1fr auto}
    #side{border-left:none; border-top:1px solid var(--line); max-height:52vh}
    #dial{bottom:10px} #dial input{width:120px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div class="layer" id="lA"></div>
    <div class="layer" id="lB"></div>
    <div id="top">
      <button class="chip" id="spin">⟳ Автоповорот</button>
      <button class="chip" id="front">Анфас</button>
      <button class="chip" id="prof">Профиль</button>
      <button class="chip" id="back">Со спины</button>
      <span class="grow"></span>
      <button class="chip" id="rnd">Случайный образ</button>
      <button class="chip" id="shot">Снимок</button>
    </div>
    <div id="dial">
      <input type="range" id="rng" min="0" max="359" value="0" step="1">
      <span id="deg">0°</span>
    </div>
    <div id="msg"><div class="box"><b id="msgT"></b><span id="msgS"></span></div></div>
  </div>

  <aside id="side">
    <header>
      <h1>Примерочная</h1>
      <div class="sub" id="sub">Выберите верх, низ и обувь — комбинируется свободно</div>
    </header>
    <div id="picks"></div>
    <footer>
      <div id="foot"></div>
      <div id="bar"><i style="width:0"></i></div>
    </footer>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const stage=$('#stage'), lA=$('#lA'), lB=$('#lB'), rng=$('#rng'), degEl=$('#deg');
const picksEl=$('#picks'), footEl=$('#foot'), msg=$('#msg');

let D=null, sel={top:null,bottom:null,shoes:null}, angle=0, spinning=false, dragging=false;

const cid = (s=sel) => `${s.top}-${s.bottom}-${s.shoes}`;
const framesOf = id => (D && D.combos[id]) || {};

/* Кадры могут покрывать НЕполный круг: у исходного сочетания их восемь, у
   остальных четыре. Поэтому ищем ближайшие снятые углы слева и справа и
   смешиваем — один и тот же код работает и для 4, и для 8, и для 24 ракурсов. */
function nearest(fr, a){
  const keys = Object.keys(fr).map(Number).sort((x,y)=>x-y);
  if (!keys.length) return null;
  if (keys.length === 1) return {lo:keys[0], hi:keys[0], t:0};
  let lo=keys[keys.length-1], hi=keys[0];
  for (const k of keys) if (k <= a) lo = k;
  for (let i=keys.length-1;i>=0;i--) if (keys[i] >= a) hi = keys[i];
  if (lo === hi) return {lo,hi,t:0};
  let span = hi-lo; if (span < 0) span += 360;
  let off = a-lo;   if (off < 0) off += 360;
  return {lo, hi, t: span ? off/span : 0};
}

function render(){
  const fr = framesOf(cid());
  const n = nearest(fr, angle);
  degEl.textContent = Math.round(angle)+'°';
  rng.value = Math.round(angle);
  if (!n){
    // Сочетание ещё не снято — честно говорим об этом, а не показываем чужое.
    msg.classList.add('on');
    $('#msgT').textContent = 'Этот комплект ещё снимается';
    $('#msgS').textContent = `Готово ${D.ready} из ${D.total}. Выберите другое сочетание — или вернитесь позже, кадры доснимаются.`;
    lA.style.backgroundImage = lB.style.backgroundImage = 'none';
    return;
  }
  msg.classList.remove('on');
  lA.style.backgroundImage = `url("${fr[n.lo]}")`;
  lB.style.backgroundImage = `url("${fr[n.hi]}")`;
  lB.style.opacity = n.t;
}
const setAngle = a => { angle = ((a%360)+360)%360; render(); };

/* ---- поворот перетаскиванием ---- */
let px=0, vel=0;
stage.addEventListener('pointerdown', e=>{
  stage.setPointerCapture(e.pointerId); dragging=true; px=e.clientX; vel=0;
  spinning=false; $('#spin').classList.remove('on'); stage.classList.add('grabbing');
});
stage.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-px; px=e.clientX;
  vel = dx * (360/Math.max(320, stage.clientWidth*0.9));
  setAngle(angle+vel);
});
for (const ev of ['pointerup','pointercancel'])
  stage.addEventListener(ev, ()=>{ dragging=false; stage.classList.remove('grabbing'); });
rng.addEventListener('input', ()=>{ spinning=false; $('#spin').classList.remove('on'); setAngle(+rng.value); });

$('#spin').onclick = e=>{ spinning=!spinning; e.target.classList.toggle('on', spinning); };
$('#front').onclick= ()=>{ spinning=false; $('#spin').classList.remove('on'); setAngle(0); };
$('#prof').onclick = ()=>{ spinning=false; $('#spin').classList.remove('on'); setAngle(90); };
$('#back').onclick = ()=>{ spinning=false; $('#spin').classList.remove('on'); setAngle(180); };
$('#shot').onclick = ()=>{
  const fr=framesOf(cid()), n=nearest(fr, angle); if(!n) return;
  const a=document.createElement('a');
  a.href = fr[n.t>0.5?n.hi:n.lo]; a.download = cid()+'_'+Math.round(angle)+'.png'; a.click();
};
$('#rnd').onclick = ()=>{
  // Случайный образ выбираем ТОЛЬКО из снятых, иначе кнопка чаще всего вела бы
  // в заглушку «ещё снимается».
  const ready = Object.keys(D.combos).filter(k=>Object.keys(D.combos[k]).length);
  if(!ready.length) return;
  const [t,b,s] = ready[Math.floor(Math.random()*ready.length)].split('-');
  sel = {top:t, bottom:b, shoes:s}; drawPicks(); render();
};

(function loop(){
  requestAnimationFrame(loop);
  if (spinning && !dragging) setAngle(angle+0.4);
  else if (!dragging && Math.abs(vel) > 0.05){ vel *= 0.94; setAngle(angle+vel); }
})();

/* ---- выбор одежды ---- */
const RU = {top:'Верх', bottom:'Низ', shoes:'Обувь'};

/** Превью для варианта: кадр того сочетания, что получится при его выборе.
 *  Если оно ещё не снято — берём любое снятое с этой вещью, чтобы вещь было
 *  видно, а не серый квадрат. */
function thumbFor(slot, id){
  const probe = {...sel, [slot]: id};
  const direct = framesOf(cid(probe));
  if (direct[0]) return direct[0];
  for (const [k, fr] of Object.entries(D.combos)){
    const parts = k.split('-');
    const idx = {top:0, bottom:1, shoes:2}[slot];
    if (parts[idx] === id && fr[0]) return fr[0];
  }
  return null;
}

function drawPicks(){
  picksEl.innerHTML = '';
  for (const slot of ['top','bottom','shoes']){
    const row = document.createElement('div'); row.className='row';
    const lbl = document.createElement('div'); lbl.className='lbl'; lbl.textContent=RU[slot];
    const opts = document.createElement('div'); opts.className='opts';
    for (const it of D.items[slot]){
      const o = document.createElement('div');
      o.className = 'opt' + (sel[slot]===it.id ? ' on':'');
      const th = document.createElement('div'); th.className='th';
      const u = thumbFor(slot, it.id);
      if (u) th.style.backgroundImage = `url("${u}")`;
      const nm = document.createElement('div'); nm.className='nm'; nm.textContent=it.name;
      o.append(th, nm);
      o.onclick = ()=>{ sel[slot]=it.id; drawPicks(); render(); preload(); };
      opts.appendChild(o);
    }
    row.append(lbl, opts); picksEl.appendChild(row);
  }
}

function preload(){
  for (const u of Object.values(framesOf(cid()))) { const i=new Image(); i.src=u; }
}

fetch('assets/outfits.json?v='+Date.now()).then(r=>r.json()).then(j=>{
  D = j;
  if (j.bg) stage.style.background = j.bg;
  footEl.textContent = j.note || '';
  $('#bar i').style.width = Math.round(100*j.ready/j.total)+'%';
  // Стартуем с готового сочетания, чтобы первый экран не был заглушкой.
  const first = Object.keys(j.combos).find(k=>Object.keys(j.combos[k]).length) || Object.keys(j.combos)[0];
  const [t,b,s] = first.split('-');
  sel = {top:t, bottom:b, shoes:s};
  drawPicks(); render(); preload();
}).catch(()=>{
  msg.classList.add('on');
  $('#msgT').textContent='Не удалось загрузить каталог';
  $('#msgS').textContent='Обновите страницу.';
});
</script>
</body>
</html>
