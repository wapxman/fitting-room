<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Примерочная · 3D</title>
<style>
  :root{
    --bg:#0e1014; --panel:#15181f; --panel2:#1b1f28; --line:#262b36;
    --ink:#eef1f6; --dim:#97a0b0; --accent:#6ea8fe; --accent2:#2b3a55;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #app{display:grid; grid-template-columns:1fr 330px; height:100%}
  #stage{position:relative; min-width:0}
  canvas{display:block; width:100%; height:100%; touch-action:none}

  /* ---- верхняя панель над сценой ---- */
  #top{
    position:absolute; left:14px; top:14px; right:14px; display:flex; gap:8px;
    align-items:center; pointer-events:none; flex-wrap:wrap;
  }
  .chip{
    pointer-events:auto; background:rgba(21,24,31,.82); border:1px solid var(--line);
    color:var(--ink); padding:8px 12px; border-radius:999px; font-size:13px;
    cursor:pointer; backdrop-filter:blur(8px); user-select:none; white-space:nowrap;
  }
  .chip:hover{border-color:#3a4252}
  .chip.on{background:var(--accent); color:#0b1220; border-color:transparent; font-weight:600}
  .grow{flex:1}
  #hint{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    color:var(--dim); font-size:12.5px; background:rgba(21,24,31,.75);
    padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    pointer-events:none; backdrop-filter:blur(8px); text-align:center;
  }

  /* ---- правая панель с одеждой ---- */
  #side{
    background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  #side header{padding:16px 16px 10px; border-bottom:1px solid var(--line)}
  #side h1{margin:0 0 3px; font-size:16px; letter-spacing:.2px}
  #side .sub{color:var(--dim); font-size:12px}
  #tabs{display:flex; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .tab{
    flex:1 1 auto; text-align:center; padding:7px 4px; border-radius:9px; font-size:12.5px;
    background:var(--panel2); border:1px solid transparent; cursor:pointer; color:var(--dim);
  }
  .tab.on{color:var(--ink); border-color:var(--accent); background:var(--accent2)}
  #list{overflow-y:auto; padding:12px; flex:1; min-height:0; scrollbar-width:thin}
  .card{
    display:flex; gap:11px; align-items:center; padding:9px; border-radius:11px;
    background:var(--panel2); border:1px solid transparent; cursor:pointer; margin-bottom:8px;
  }
  .card:hover{border-color:#333b4a}
  .card.on{border-color:var(--accent); background:var(--accent2)}
  .sw{width:36px; height:36px; border-radius:9px; flex:none; border:1px solid rgba(255,255,255,.14)}
  .card .nm{font-size:13.5px}
  .card .ds{font-size:11.5px; color:var(--dim)}
  .sect{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:14px 2px 8px}
  .sect:first-child{margin-top:2px}
  #colors{display:grid; grid-template-columns:repeat(8,1fr); gap:7px; padding:0 2px}
  .col{aspect-ratio:1; border-radius:7px; cursor:pointer; border:2px solid transparent}
  .col.on{border-color:#fff}
  #side footer{padding:11px 14px; border-top:1px solid var(--line); color:var(--dim); font-size:11.5px}
  #ref{width:100%; border-radius:10px; display:block; margin-top:8px; border:1px solid var(--line)}

  #drop{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(14,16,20,.86); border:2px dashed var(--accent); z-index:9; font-size:15px;
  }
  #drop.on{display:flex}
  #load{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:14px; z-index:5;
  }
  @media (max-width:880px){
    #app{grid-template-columns:1fr; grid-template-rows:1fr auto}
    #side{border-left:none; border-top:1px solid var(--line); max-height:46vh}
    #ref{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="load">Собираю фигуру…</div>
    <div id="top">
      <button class="chip" id="spin">⟳ Автоповорот</button>
      <button class="chip" id="front">Анфас</button>
      <button class="chip" id="side90">Профиль</button>
      <button class="chip" id="back">Со спины</button>
      <span class="grow"></span>
      <button class="chip" id="bgBtn">Фон</button>
      <button class="chip" id="shot">Снимок</button>
    </div>
    <div id="hint">Тяните мышью или пальцем — поворот на 360°. Колесо — приблизить.</div>
    <div id="drop">Отпустите .glb — загружу вашу 3D-модель</div>
  </div>

  <aside id="side">
    <header>
      <h1>Примерочная</h1>
      <div class="sub">Фигура построена по пропорциям с вашего кадра</div>
    </header>
    <div id="tabs">
      <div class="tab on" data-c="top">Верх</div>
      <div class="tab" data-c="bottom">Низ</div>
      <div class="tab" data-c="shoes">Обувь</div>
      <div class="tab" data-c="outer">Верхняя</div>
    </div>
    <div id="list"></div>
    <footer>
      <div>Перетащите сюда <b>.glb</b> — покажу вашу настоящую 3D-модель.</div>
      <img id="ref" alt="исходный кадр" onerror="this.style.display='none'">
    </footer>
  </aside>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { M, limb, cap, smooth, torsoProfile, armProfile, legProfile } from './js/body.js';

const H = M.heightM;
const L = M.level;
const yOf = (frac) => H * (1 - frac);   // доля от макушки -> высота от пола

// ---------- сцена ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
camera.position.set(0, H * 0.55, 4.1);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const BACKDROPS = [
  { name:'студия',  a:'#20242e', b:'#0c0e12', floor:0x1a1e26 },
  { name:'светлая', a:'#e9ecf2', b:'#bcc3cf', floor:0xd5dae2 },
  { name:'тёплая',  a:'#2a2119', b:'#120d09', floor:0x241b14 },
];
let bgIdx = 0;
function applyBackdrop(){
  const b = BACKDROPS[bgIdx];
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d').createLinearGradient(0,0,0,256);
  g.addColorStop(0,b.a); g.addColorStop(1,b.b);
  const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0,0,2,256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
  floor.material.color.setHex(b.floor);
}

// пол + мягкая тень
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 64).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ color:0x1a1e26, roughness:.96, metalness:0 })
);
floor.receiveShadow = true; scene.add(floor);

const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(2.4, 3.6, 2.8); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 12;
key.shadow.camera.left = -2; key.shadow.camera.right = 2;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -0.5;
key.shadow.bias = -0.0012; key.shadow.radius = 3;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x9fc4ff, 0.55).translateX(-3).translateY(2).translateZ(-1.5));
const rim = new THREE.DirectionalLight(0xffffff, 1.1); rim.position.set(-1.5, 2.2, -3); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x20242c, 0.5));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.target.set(0, H * 0.52, 0);
controls.minDistance = 1.2; controls.maxDistance = 7;
controls.minPolarAngle = 0.25; controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.autoRotateSpeed = 2.2;

// ---------- материалы ----------
const skinMat = new THREE.MeshStandardMaterial({ color:M.color.skin, roughness:.68, metalness:0 });
const hairMat = new THREE.MeshStandardMaterial({ color:M.color.hair, roughness:.52, metalness:.06 });
const eyeMat  = new THREE.MeshStandardMaterial({ color:0x231a14, roughness:.25 });
function cloth(hex, rough=0.82, metal=0){
  return new THREE.MeshStandardMaterial({ color:hex, roughness:rough, metalness:metal });
}

const person = new THREE.Group(); scene.add(person);
const bodyGrp = new THREE.Group(); person.add(bodyGrp);
const wearGrp = new THREE.Group(); person.add(wearGrp);

function add(group, geo, mat, pos, rot){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  group.add(m); return m;
}

// ---------- геометрия тела ----------
// Все уровни — от макушки вниз (M.level), переведены в высоту над полом через yOf.
const torsoTopY = yOf(0.155);                 // основание шеи
const torsoBotY = yOf(L.crotch);              // пах
const torsoH = torsoTopY - torsoBotY;

// ⚠️ Крепление рук считается ОТ ПОЛУШИРИНЫ ТОРСА, а не задаётся отдельно.
// Именно рассогласование этих двух чисел утопило руки внутрь корпуса в первой
// версии. Теперь рука садится у самой кромки плеча и всегда снаружи.
// Рука садится ВПЛОТНУЮ к кромке торса на уровне верха груди. Тогда полный
// размах плеч собирается сам: торс (0,096H) + радиус руки (0,029H) с каждой
// стороны = 0,250H, ровно биакромиальная ширина. Задавать размах отдельным
// числом нельзя — именно рассогласование двух чисел и утопило руки в корпус.
const ARM_R0 = 0.0290 * H;
const shoulderX = M.width.chest / 2 * H * 1.03;
const shoulderY = yOf(0.200);
const ARM_LEN = H * 0.355;                    // плечо → запястье
const ARM_TILT = 0.20;                        // A-поза как на исходном кадре

const legTopY = torsoBotY + H * 0.012;
const ankleY = yOf(L.ankle);
const legLen = legTopY - ankleY;
const legX = H * 0.055;

function buildBody(){
  bodyGrp.clear();
  const tp = torsoProfile(H);

  add(bodyGrp, limb(tp, torsoH, 56, 32), skinMat, [0,(torsoTopY+torsoBotY)/2,0]);
  const [sx,sz] = tp(0), [hx,hz] = tp(1);
  add(bodyGrp, cap(sx, sz, H*0.045, true), skinMat, [0, torsoTopY, 0]);
  // Низ торса — приплюснутый купол. Полная полусфера радиуса бедра давала
  // вываливающийся живот: это читалось как пузо, а не как таз.
  add(bodyGrp, cap(hx*0.98, hz*0.98, H*0.030, false), skinMat, [0, torsoBotY, 0]);

  // шея + голова
  add(bodyGrp, limb(()=>[M.width.neck/2*H, M.width.neck/2*H*0.92], H*0.070, 16, 22),
      skinMat, [0, torsoTopY + H*0.030, 0]);
  const headR = M.width.head/2 * H;
  const headY = yOf(0.133) + headR*0.92;
  const head = add(bodyGrp, new THREE.SphereGeometry(headR, 44, 34), skinMat, [0, headY, 0]);
  head.scale.set(0.93, 1.18, 1.02);
  const hair = add(bodyGrp, new THREE.SphereGeometry(headR*1.04, 40, 32, 0, Math.PI*2, 0, Math.PI*0.60),
                   hairMat, [0, headY + headR*0.09, -headR*0.03]);
  hair.scale.set(0.96, 1.16, 1.04);

  // руки
  const ap = armProfile(H);
  for (const s of [-1,1]) {
    const arm = new THREE.Group();
    arm.position.set(s*shoulderX, shoulderY, 0);
    arm.rotation.z = s*ARM_TILT;   // знак: + разводит руку НАРУЖУ (см. комментарий у ARM_TILT)
    add(arm, limb(ap, ARM_LEN, 44, 24).translate(0,-ARM_LEN/2,0), skinMat);
    add(arm, cap(ARM_R0, ARM_R0*0.90, ARM_R0*1.05, true), skinMat, [0,0,0]);
    const [wx,wz] = ap(1);
    const hand = add(arm, new THREE.SphereGeometry(1, 22, 16), skinMat, [0, -ARM_LEN - H*0.035, 0]);
    hand.scale.set(wx*1.25, H*0.047, wz*2.0);
    bodyGrp.add(arm);
  }

  // ноги
  const lp = legProfile(H);
  for (const s of [-1,1]) {
    const leg = new THREE.Group();
    leg.position.set(s*legX, legTopY, 0);
    leg.rotation.z = s*0.016;
    add(leg, limb(lp, legLen, 48, 26).translate(0,-legLen/2,0), skinMat);
    const [tx,tz] = lp(0);
    add(leg, cap(tx, tz, H*0.030, true), skinMat, [0,0,0]);
    bodyGrp.add(leg);
  }
}

// ---------- одежда ----------
// Каждая вещь строится из ТЕХ ЖЕ профилей тела с припуском (pad), поэтому
// садится по фигуре. Меняется цвет и крой (где начинается и где заканчивается).
// Уровень тела (доля от макушки) -> параметр t вдоль торса. Нужен, чтобы кроить
// одежду в человеческих терминах («подол на уровне бедра»), а не угадывать t.
const tAt = (level) => (level - 0.155) / (L.crotch - 0.155);

function makeTop(cfg){
  const g = new THREE.Group();
  const mat = cloth(cfg.color, cfg.rough ?? 0.85, cfg.metal ?? 0);
  const pad = cfg.pad ?? H*0.009;
  const t0 = cfg.t0 ?? 0.02, t1 = Math.min(1, cfg.t1 ?? 0.88);
  const yTop = torsoTopY - torsoH*t0, yBot = torsoTopY - torsoH*t1;
  const base = torsoProfile(H, pad);
  const prof = (t) => base(t0 + (t1-t0)*t);
  add(g, limb(prof, yTop-yBot, 52, 30), mat, [0,(yTop+yBot)/2,0]);
  const [ax,az] = prof(0), [bx,bz] = prof(1);
  add(g, new THREE.TorusGeometry((ax+az)/2*0.88, pad*0.75, 10, 40).rotateX(Math.PI/2), mat, [0,yTop,0]);
  add(g, new THREE.TorusGeometry((bx+bz)/2*0.99, pad*0.55, 10, 40).rotateX(Math.PI/2), mat, [0,yBot,0]);

  // Полы ниже паха — у пальто и пуховика. Без этого «длинное пальто» кончалось
  // ровно там же, где футболка, и отличить их было нельзя.
  if (cfg.skirt > 0){
    const len = legLen*cfg.skirt;
    const r0 = (bx+bz)/2;
    add(g, limb((t)=>{ const r = r0*(1 + 0.10*t); return [r, r*0.92]; }, len, 24, 30),
        mat, [0, yBot - len/2, 0]);
  }

  if (cfg.sleeve > 0) {
    const ap = armProfile(H, pad*0.95);
    for (const s of [-1,1]) {
      const arm = new THREE.Group();
      arm.position.set(s*shoulderX, shoulderY, 0);
      arm.rotation.z = s*ARM_TILT;   // знак: + разводит руку НАРУЖУ (см. комментарий у ARM_TILT)
      const len = ARM_LEN*cfg.sleeve;
      add(arm, limb((t)=>ap(t*cfg.sleeve), len, 34, 22).translate(0,-len/2,0), mat);
      add(arm, cap(ARM_R0+pad, (ARM_R0+pad)*0.90, (ARM_R0+pad)*1.05, true), mat, [0,0,0]);
      const [ex,ez] = ap(cfg.sleeve);
      add(arm, new THREE.TorusGeometry((ex+ez)/2, pad*0.95, 8, 26).rotateX(Math.PI/2), mat, [0,-len,0]);
      g.add(arm);
    }
  }
  return g;
}

function makeBottom(cfg){
  const g = new THREE.Group();
  const mat = cloth(cfg.color, cfg.rough ?? 0.88, cfg.metal ?? 0);
  const pad = cfg.pad ?? H*0.010;
  // Пояс: от чуть ниже талии до паха — в терминах уровней тела, не «на глаз».
  const tTop = tAt(0.415);   // ниже подола верха: одежда должна наслаиваться как в жизни
  const yTop = torsoTopY - torsoH*tTop;
  // Пояс опускается НИЖЕ паха: иначе между ним и штанинами зияла щель, и в ней
  // просвечивал купол таза — это читалось как голый живот под ремнём.
  const yBot = torsoBotY - H*0.030;
  const tb = torsoProfile(H, pad);
  add(g, limb((t)=>tb(Math.min(1, tTop + (1.06-tTop)*t)), yTop - yBot, 26, 30),
      mat, [0, (yTop+yBot)/2, 0]);

  const frac = cfg.len ?? 1.0;        // 1 — до щиколотки, 0.46 — шорты
  const wide = cfg.wide ?? 1.0;
  const lp = legProfile(H, pad);
  for (const s of [-1,1]) {
    const leg = new THREE.Group();
    leg.position.set(s*legX, legTopY + H*0.004, 0);
    leg.rotation.z = s*0.016;
    const len = legLen*frac;
    add(leg, limb((t)=>{
      const [rx,rz] = lp(t*frac);
      const k = 1 + (wide-1)*t;
      return [rx*k, rz*k];
    }, len, 40, 26).translate(0,-len/2,0), mat);
    const [ex,ez] = lp(frac);
    add(leg, new THREE.TorusGeometry((ex+ez)/2*wide, pad*0.9, 8, 30).rotateX(Math.PI/2), mat, [0,-len,0]);
    g.add(leg);
  }
  return g;
}

function makeShoes(cfg){
  const g = new THREE.Group();
  const mat = cloth(cfg.color, cfg.rough ?? 0.7, cfg.metal ?? 0);
  const sole = cloth(cfg.sole ?? 0xf2f2f4, 0.9);
  for (const s of [-1,1]) {
    const f = new THREE.Group();
    f.position.set(s*legX, 0, 0);
    const up = add(f, new THREE.SphereGeometry(1, 26, 18), mat, [0, H*0.030, H*0.016]);
    up.scale.set(H*0.038, H*0.030, H*0.072);
    const bk = add(f, new THREE.SphereGeometry(1, 22, 16), mat, [0, H*0.032, -H*0.022]);
    bk.scale.set(H*0.036, H*0.034, H*0.034);
    add(f, new THREE.BoxGeometry(H*0.076, H*0.016, H*0.165), sole, [0, H*0.009, H*0.010]);
    if (cfg.high) {
      add(f, limb(()=>[H*0.037,H*0.035], H*0.085, 12, 20), mat, [0, H*0.088, -H*0.006]);
    }
    g.add(f);
  }
  return g;
}

// ---------- каталог ----------
const PAL = [0x1d2026,0x2f3a4f,0x3f5e8c,0x6ea8fe,0x8d9aad,0xd8dbe2,0xf2f3f5,
             0x5a3f2e,0x8c5a3c,0xc08a4e,0x7a1f2b,0xb33a3a,0x2f5d3f,0x4f7a4a,0x6b4f8a,0x111214];

const CATALOG = {
  top: [
    { id:'tee',    name:'Футболка',         desc:'хлопок, прямой крой',  color:0xd8dbe2, build:c=>makeTop({color:c, sleeve:0.33, t1:0.93}) },
    { id:'long',   name:'Лонгслив',         desc:'облегающий',           color:0x2f3a4f, build:c=>makeTop({color:c, sleeve:0.98, t1:0.94, pad:H*0.007}) },
    { id:'polo',   name:'Поло',             desc:'воротник, пике',       color:0x3f5e8c, build:c=>makeTop({color:c, sleeve:0.30, t1:0.92}) },
    { id:'shirt',  name:'Рубашка',          desc:'свободная, навыпуск',  color:0xf2f3f5, build:c=>makeTop({color:c, sleeve:0.95, t1:0.97, pad:H*0.014, rough:0.74}) },

const worn = {};           // категория -> { item, color, group }
function wear(cat, item, color){
  if (worn[cat]?.group) wearGrp.remove(worn[cat].group);
  const col = color ?? item.color;
  const grp = item.build(col);
  grp.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  wearGrp.add(grp);
  worn[cat] = { item, color: col, group: grp };
}

// ---------- интерфейс ----------
let activeCat = 'top';
const listEl = document.getElementById('list');

function renderList(){
  const items = CATALOG[activeCat];
  listEl.innerHTML = '';
  const s1 = document.createElement('div'); s1.className='sect'; s1.textContent='Модель';
  listEl.appendChild(s1);
  for (const it of items){
    const d = document.createElement('div');
    d.className = 'card' + (worn[activeCat]?.item.id === it.id ? ' on' : '');
    const sw = document.createElement('div'); sw.className='sw';
    sw.style.background = it.id.startsWith('no') || it.id==='barefoot'
      ? 'repeating-linear-gradient(45deg,#2a2f3a 0 6px,#20242c 6px 12px)'
      : '#'+it.color.toString(16).padStart(6,'0');
    const tx = document.createElement('div');
    tx.innerHTML = `<div class="nm">${it.name}</div><div class="ds">${it.desc}</div>`;
    d.append(sw, tx);
    d.onclick = ()=>{ wear(activeCat, it, worn[activeCat]?.item.id===it.id ? worn[activeCat].color : undefined); renderList(); };
    listEl.appendChild(d);
  }
  const cur = worn[activeCat];
  if (cur && cur.item.build.length > 0){
    const s2 = document.createElement('div'); s2.className='sect'; s2.textContent='Цвет';
    listEl.appendChild(s2);
    const wrap = document.createElement('div'); wrap.id='colors';
    for (const c of PAL){
      const b = document.createElement('div');
      b.className = 'col' + (cur.color===c ? ' on':'');
      b.style.background = '#'+c.toString(16).padStart(6,'0');
      b.onclick = ()=>{ wear(activeCat, cur.item, c); renderList(); };
      wrap.appendChild(b);
    }
    listEl.appendChild(wrap);
  }
}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); activeCat = t.dataset.c; renderList();
  };
});

// ракурсы
function flyTo(az){
  const d = camera.position.distanceTo(controls.target);
  const p = controls.target.clone();
  camera.position.set(p.x + Math.sin(az)*d, camera.position.y, p.z + Math.cos(az)*d);
  controls.update();
}
document.getElementById('front').onclick  = ()=>flyTo(0);
document.getElementById('side90').onclick = ()=>flyTo(Math.PI/2);
document.getElementById('back').onclick   = ()=>flyTo(Math.PI);
const spinBtn = document.getElementById('spin');
spinBtn.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; spinBtn.classList.toggle('on', controls.autoRotate); };
document.getElementById('bgBtn').onclick = ()=>{ bgIdx = (bgIdx+1)%BACKDROPS.length; applyBackdrop(); };
document.getElementById('shot').onclick = ()=>{
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'primerochnaya.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
};

// загрузка настоящей модели .glb
const drop = document.getElementById('drop');
addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('on'); });
addEventListener('dragleave', e=>{ if(e.relatedTarget===null) drop.classList.remove('on'); });
addEventListener('drop', async e=>{
  e.preventDefault(); drop.classList.remove('on');
  const f = [...e.dataTransfer.files].find(f=>/\.(glb|gltf)$/i.test(f.name));
  if (!f) return;
  const url = URL.createObjectURL(f);
  new GLTFLoader().load(url, (g)=>{
    bodyGrp.clear(); wearGrp.clear();
    const o = g.scene;
    const box = new THREE.Box3().setFromObject(o);
    const size = box.getSize(new THREE.Vector3());
    const k = H / (size.y || 1);
    o.scale.setScalar(k);
    const b2 = new THREE.Box3().setFromObject(o);
    o.position.y -= b2.min.y;
    o.position.x -= (b2.max.x+b2.min.x)/2;
    o.position.z -= (b2.max.z+b2.min.z)/2;
    o.traverse(m=>{ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
    bodyGrp.add(o);
    document.getElementById('hint').textContent = 'Загружена ваша модель: ' + f.name;
  }, undefined, ()=>{ document.getElementById('hint').textContent = 'Не удалось прочитать файл'; });
});

document.getElementById('ref').src = 'assets/reference.jpg';

// ---------- запуск ----------
buildBody();
applyBackdrop();
wear('top',    CATALOG.top.find(i=>i.id==='tee'));
wear('bottom', CATALOG.bottom.find(i=>i.id==='jeans'));
wear('shoes',  CATALOG.shoes.find(i=>i.id==='sneak'));
wear('outer',  CATALOG.outer[0]);
renderList();
document.getElementById('load').remove();

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
